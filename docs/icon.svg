<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="J2PC icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131a2b"/>
      <stop offset="55%" stop-color="#1b2540"/>
      <stop offset="100%" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a5e"/>
      <stop offset="100%" stop-color="#16203a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="round">
      <rect x="4" y="4" width="248" height="248" rx="52"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="4" y="4" width="248" height="248" fill="url(#bg)"/>

    <!-- faint grid -->
    <g stroke="#8ab4ff" stroke-opacity="0.07" stroke-width="1">
      <path d="M4 44h248M4 84h248M4 124h248M4 164h248M4 204h248"/>
      <path d="M44 4v248M84 4v248M124 4v248M164 4v248M204 4v248"/>
    </g>

    <!-- phone -->
    <g transform="translate(36 62)">
      <rect x="0" y="0" width="60" height="104" rx="12" fill="url(#screen)" stroke="#3f5a8c" stroke-width="3"/>
      <rect x="7" y="11" width="46" height="58" rx="4" fill="#0b1220"/>
      <circle cx="30" cy="86" r="6" fill="none" stroke="#3f5a8c" stroke-width="3"/>
      <rect x="20" y="16" width="20" height="3" rx="1.5" fill="#22d3ee" opacity="0.85"/>
      <rect x="20" y="24" width="14" height="3" rx="1.5" fill="#60a5fa" opacity="0.7"/>
    </g>

    <!-- arrow -->
    <g filter="url(#glow)" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"
       stroke-linejoin="round" fill="none">
      <path d="M108 114h34"/>
      <path d="M132 101l14 13-14 13"/>
    </g>

    <!-- monitor -->
    <g transform="translate(154 66)">
      <rect x="0" y="0" width="70" height="52" rx="8" fill="url(#screen)" stroke="url(#accent)" stroke-width="3"/>
      <rect x="8" y="8" width="54" height="36" rx="4" fill="#0b1220"/>
      <rect x="14" y="15" width="26" height="3" rx="1.5" fill="#22d3ee" opacity="0.9"/>
      <rect x="14" y="23" width="36" height="3" rx="1.5" fill="#a78bfa" opacity="0.75"/>
      <rect x="14" y="31" width="18" height="3" rx="1.5" fill="#60a5fa" opacity="0.6"/>
      <rect x="28" y="52" width="14" height="9" fill="#3f5a8c"/>
      <rect x="14" y="61" width="42" height="5" rx="2.5" fill="#3f5a8c"/>
    </g>

    <!-- wordmark -->
    <text x="128" y="212" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="34" font-weight="700" letter-spacing="2" fill="#eaf2ff">J2PC</text>
    <text x="128" y="231" text-anchor="middle"
          font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="11" font-weight="500" letter-spacing="3.4" fill="#7f9ac4">STATIC RECOMPILER</text>
  </g>

  <rect x="4" y="4" width="248" height="248" rx="52" fill="none" stroke="url(#accent)"
        stroke-opacity="0.55" stroke-width="2"/>
</svg>
