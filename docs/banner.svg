<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="J2PC banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="50%" stop-color="#141d31"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3a5e"/>
      <stop offset="100%" stop-color="#16203a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#8ab4ff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 40h1280M0 80h1280M0 120h1280M0 160h1280M0 200h1280M0 240h1280M0 280h1280"/>
    <path d="M40 0v320M80 0v320M120 0v320M160 0v320M200 0v320M240 0v320M280 0v320M320 0v320M360 0v320M400 0v320M440 0v320M480 0v320M520 0v320M560 0v320M600 0v320M640 0v320M680 0v320M720 0v320M760 0v320M800 0v320M840 0v320M880 0v320M920 0v320M960 0v320M1000 0v320M1040 0v320M1080 0v320M1120 0v320M1160 0v320M1200 0v320M1240 0v320"/>
  </g>

  <!-- glow blob -->
  <ellipse cx="250" cy="160" rx="210" ry="150" fill="#22d3ee" opacity="0.07"/>

  <!-- phone -->
  <g transform="translate(118 72)">
    <rect x="0" y="0" width="88" height="152" rx="18" fill="url(#screen)" stroke="#3f5a8c" stroke-width="4"/>
    <rect x="10" y="16" width="68" height="86" rx="6" fill="#0b1220"/>
    <circle cx="44" cy="126" r="9" fill="none" stroke="#3f5a8c" stroke-width="4"/>
    <rect x="28" y="24" width="30" height="4" rx="2" fill="#22d3ee" opacity="0.9"/>
    <rect x="28" y="36" width="20" height="4" rx="2" fill="#60a5fa" opacity="0.75"/>
    <rect x="28" y="48" width="26" height="4" rx="2" fill="#a78bfa" opacity="0.6"/>
  </g>

  <!-- arrow -->
  <g filter="url(#glow)" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"
     stroke-linejoin="round" fill="none">
    <path d="M232 148h60"/>
    <path d="M272 124l26 24-26 24"/>
  </g>

  <!-- monitor -->
  <g transform="translate(318 84)">
    <rect x="0" y="0" width="116" height="86" rx="12" fill="url(#screen)" stroke="url(#accent)" stroke-width="4"/>
    <rect x="12" y="12" width="92" height="62" rx="6" fill="#0b1220"/>
    <rect x="24" y="24" width="44" height="4" rx="2" fill="#22d3ee" opacity="0.9"/>
    <rect x="24" y="36" width="60" height="4" rx="2" fill="#a78bfa" opacity="0.75"/>
    <rect x="24" y="48" width="30" height="4" rx="2" fill="#60a5fa" opacity="0.6"/>
    <rect x="46" y="86" width="24" height="16" fill="#3f5a8c"/>
    <rect x="24" y="102" width="68" height="8" rx="4" fill="#3f5a8c"/>
  </g>

  <!-- text block -->
  <text x="500" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="76" font-weight="700" letter-spacing="3" fill="#eaf2ff">J2PC</text>
  <text x="503" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="500" letter-spacing="5" fill="#7f9ac4">J2ME STATIC RECOMPILER</text>

  <!-- chips -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="503" y="216" width="118" height="30" rx="15" fill="#22d3ee" opacity="0.13"/>
    <text x="562" y="236" text-anchor="middle" fill="#5eead4">pure Java</text>

    <rect x="633" y="216" width="132" height="30" rx="15" fill="#60a5fa" opacity="0.13"/>
    <text x="699" y="236" text-anchor="middle" fill="#93c5fd">no deps</text>

    <rect x="777" y="216" width="146" height="30" rx="15" fill="#a78bfa" opacity="0.13"/>
    <text x="850" y="236" text-anchor="middle" fill="#c4b5fd">exact output</text>

    <rect x="935" y="216" width="170" height="30" rx="15" fill="#f472b6" opacity="0.13"/>
    <text x="1020" y="236" text-anchor="middle" fill="#f9a8d4">win · linux · mac</text>
  </g>
</svg>
