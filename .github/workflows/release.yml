name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to publish (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Determine version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Self test
        run: |
          chmod +x tools/*.sh
          ./tools/selftest.sh
          ./tools/verify.sh

      - name: Stage release files
        run: |
          mkdir -p release
          cp dist/j2pc.jar "release/j2pc-${{ steps.ver.outputs.tag }}.jar"
          cp README.md LICENSE release/
          cp -r docs release/docs
          ( cd dist && jar tf j2pc.jar ) > release/CONTENTS.txt

      - name: Create source archive
        run: |
          git archive --format=zip --prefix="j2pc-${{ steps.ver.outputs.tag }}/" \
            -o "release/j2pc-${{ steps.ver.outputs.tag }}-sources.zip" HEAD

      - name: Checksums
        run: |
          cd release
          sha256sum *.jar *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: J2PC ${{ steps.ver.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            release/j2pc-${{ steps.ver.outputs.tag }}.jar
            release/j2pc-${{ steps.ver.outputs.tag }}-sources.zip
            release/SHA256SUMS.txt
            release/README.md
            release/LICENSE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.tag }}
          path: release
          retention-days: 30
