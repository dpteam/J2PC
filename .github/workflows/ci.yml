name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'

jobs:
  # ---------------------------------------------------------------- build ----
  build:
    name: Build (JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Show toolchain
        run: java -version && javac -version

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.cmd

      - name: Smoke test the CLI
        shell: bash
        run: |
          java -jar dist/j2pc.jar --version
          java -jar dist/j2pc.jar --help

      - name: Upload j2pc.jar
        uses: actions/upload-artifact@v4
        with:
          name: j2pc-jar-jdk${{ matrix.java }}-${{ runner.os }}
          path: dist/j2pc.jar
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------- self-test ----
  # Builds a synthetic MIDlet suite from src/test, recompiles it, compiles the
  # generated Java, and compares behaviour against the original. No third-party
  # JARs are involved, so this runs on a clean checkout.
  self-test:
    name: Self test
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download j2pc.jar
        uses: actions/download-artifact@v4
        with:
          name: j2pc-jar-jdk21-${{ runner.os == 'Windows' && 'Windows' || 'Linux' }}
          path: dist

      - name: Self test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x tools/*.sh
          ./tools/selftest.sh
          ./tools/verify.sh

      - name: Self test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call tools\selftest.cmd
          if errorlevel 1 exit /b 1
          call tools\verify.cmd

      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test-${{ runner.os }}
          path: |
            build/selftest/out
            build/verify/original.txt
            build/verify/recompiled.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------- test suite ----
  # Runs against the local sample corpus when it is present. The corpus is not
  # part of the repository, so this job is skipped on a clean checkout.
  corpus:
    name: Corpus (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    if: vars.J2PC_CORPUS == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Download j2pc.jar
        uses: actions/download-artifact@v4
        with:
          name: j2pc-jar-jdk21-${{ runner.os == 'Windows' && 'Windows' || 'Linux' }}
          path: dist

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: samples
          key: corpus-${{ hashFiles('samples/**/*.jar') }}
          restore-keys: corpus-

      - name: Run the corpus (Linux)
        if: runner.os != 'Windows'
        run: |
          chmod +x build.sh test.sh 2>/dev/null || true
          ./build.sh
          ./test.sh || true

      - name: Run the corpus (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call build.cmd
          call test.cmd

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-report-${{ runner.os }}
          path: |
            build/batch/report.csv
            build/test/javac.log
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------- aggregate ----
  status:
    name: Status
    runs-on: ubuntu-latest
    needs: [build, self-test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "build:     ${{ needs.build.result }}"
          echo "self-test: ${{ needs.self-test.result }}"
          if [ "${{ needs.build.result }}" != "success" ] || [ "${{ needs.self-test.result }}" != "success" ]; then
            echo "One or more jobs failed"
            exit 1
          fi
